<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow-lg border-0 mt-5">
        <div class="card-body text-center p-5">
          <div class="mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
          </div>
          <h2 id="resultTitle" class="mb-3">Loan Approved 🎉</h2>
          <p id="resultMessage" class="lead mb-4">Your loan has been approved successfully.</p>
          
          <!-- Smart Contract Information -->
          <div id="smartContractInfo" class="card bg-dark text-white mt-4 mb-4" style="display: none;">
            <div class="card-body text-start">
              <h5 class="card-title mb-3">
                <i class="fas fa-file-contract me-2"></i>Smart Contract Details
              </h5>
              <div class="row">
                <div class="col-md-6 mb-2">
                  <strong>Contract ID:</strong> <code id="contractId" class="text-info"></code>
                </div>
                <div class="col-md-6 mb-2">
                  <strong>Contract Hash:</strong> <code id="contractHash" class="text-info"></code>
                </div>
                <div class="col-md-6 mb-2">
                  <strong>Blockchain Address:</strong> <code id="blockchainAddress" class="text-info"></code>
                </div>
                <div class="col-md-6 mb-2">
                  <strong>IPFS Hash:</strong> <code id="ipfsHash" class="text-info"></code>
                </div>
                <div class="col-12 mt-3">
                  <a id="contractLink" href="#" target="_blank" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-external-link-alt me-2"></i>View Contract on Blockchain Explorer
                  </a>
                </div>
              </div>
            </div>
          </div>
          
          <div class="d-flex justify-content-center gap-3 flex-wrap">
            <button class="btn btn-success btn-lg px-4" onclick="downloadPDF()">
              <i class="fas fa-download me-2"></i>Download Sanction Letter
            </button>
            <a href="chat.html" class="btn btn-outline-primary btn-lg px-4">
              <i class="fas fa-redo me-2"></i>Start Over
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-lg px-4">
              <i class="fas fa-home me-2"></i>Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./js/pdf.js"></script>
</body>
</html>
